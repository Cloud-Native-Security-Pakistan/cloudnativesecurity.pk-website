name: PR Checks

on:
  pull_request:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Type check (tools/site)
      run: npm run typecheck

    - name: Generated pages match data/
      run: npm run build:check

    - name: Content and output tests
      run: npm test

    - name: Lint legacy scripts
      run: npm run lint
